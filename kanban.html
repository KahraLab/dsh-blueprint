<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">项目看板</title>
  
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><style>@media (prefers-color-scheme: dark){:root{stroke:%23fff}}</style><rect width='18' height='18' x='3' y='3' rx='3'/><path d='M8 7v7'/><path d='M12 7v4'/><path d='M16 7v9'/></svg>" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="./kanban-style.css" rel="stylesheet" />
</head>
<body data-theme="dark">

  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="3"></rect>
            <path d="M8 7v7"></path>
            <path d="M12 7v4"></path>
            <path d="M16 7v9"></path>
          </svg>
        </span>
        <span class="brand-name" id="brand-title" data-i18n="title">项目看板</span>
      </div>

      <nav class="nav-actions">
        <!-- 语言切换 -->
        <button class="btn-icon-action" id="btn-lang-toggle" data-i18n-title="btn_lang">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>

        <!-- 主题切换 -->
        <button class="btn-icon-action" id="btn-theme-toggle" data-i18n-title="btn_theme">
        </button>
      </nav>
    </div>
  </header>

  <main class="canvas-wrapper">
    <div id="kanban-mount">
    </div>
  </main>

  <!-- 任务详情抽屉 -->
  <div class="drawer-backdrop" id="drawer-backdrop">
    <div class="task-drawer" id="task-drawer">
      <div class="drawer-header">
        <button class="drawer-close-btn" id="btn-drawer-close" data-i18n-aria="close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-content">
        <div class="drawer-task-id" id="drawer-task-id-text"></div>
        <h2 class="drawer-task-title" id="drawer-task-title-text"></h2>

        <div class="properties-grid">
          <span class="prop-label" id="label-priority" data-i18n="drawer.priority_label"></span>
          <span class="prop-value" id="drawer-prop-priority"></span>

          <span class="prop-label" id="label-assignee" data-i18n="drawer.assignee_label"></span>
          <span class="prop-value" id="drawer-prop-assignee"></span>

          <span class="prop-label" id="label-status" data-i18n="drawer.status_label"></span>
          <span class="prop-value" id="drawer-prop-lane"></span>
        </div>

        <div class="timeline-section-title" id="drawer-timeline-title" data-i18n="drawer.history_title"></div>
        <div class="timeline-list" id="drawer-timeline">
        </div>
      </div>
    </div>
  </div>

  <script type="text/mermaid" id="kanban-source">
kanban
  backlog[待处理]
    plan-m4-01[设计语言 DESIGN.md 导入导出与令牌联动]@{ priority: "Low" }
    plan-m5-01[屏幕间转移连接与只读流程总览]@{ priority: "Low" }
  todo[待开发]
    feat-m3-01[一句话生成一屏协议与 Prompt 体系]@{ priority: "High" }
    feat-m3-02[画布点选与会话上下文双向联动]@{ priority: "High" }
    feat-m3-03[精准逐条语义改动响应与局部 Patch 引擎]@{ priority: "High" }
    feat-m3-04[画布点选快捷评论气泡交互]@{ priority: "Medium" }
  in_progress[进行中]
  ready_for_review[待验收]
  </script>

  <script type="module" src="./kanban-app.js"></script>

</body>
</html>
